---
- name: Update Ubuntu hosts
  hosts: managed
  become: true
  serial: 1
  vars:
    reboot_if_required: false
  pre_tasks:
    - name: Verify the target runs Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
        fail_msg: This playbook supports Ubuntu hosts only.
    - name: Refresh package lists for an actual update
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 600
      when: not ansible_check_mode
  tasks:
    - name: Upgrade packages without removing installed packages
      ansible.builtin.apt:
        upgrade: dist
        force_apt_get: true
        fail_on_autoremove: true
        dpkg_options: force-confdef,force-confold
        lock_timeout: 600
    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required
    - name: Report reboot status
      ansible.builtin.debug:
        msg: "Reboot required: {{ reboot_required.stat.exists }}; automatic reboot enabled: {{ reboot_if_required | bool }}"
    - name: Reboot when explicitly enabled
      ansible.builtin.reboot:
        reboot_timeout: 900
        post_reboot_delay: 30
      when:
        - reboot_if_required | bool
        - reboot_required.stat.exists
        - not ansible_check_mode
